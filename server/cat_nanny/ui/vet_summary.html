<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vet summary</title>
<!--
  MCP Apps view for get_vet_summary. Self-contained (no network except photo URLs), as Alexa+ requires.
  The host renders it in a sandboxed iframe and sends the tool result over postMessage
  (ui/initialize -> ui/notifications/initialized -> ui/notifications/tool-result).
  Layout follows CatNannyFramework's care report: counts, then a timeline with details and photos.
-->
<style>
  :root {
    --bg: #fbfaf7; --card: #ffffff; --ink: #1f1d1a; --muted: #6b675f; --line: #e6e2d9;
    --vomit: #c2543a; --appetite: #b7791f; --flag-bg: #fdecea; --flag-ink: #8a2a1b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#16150f; --card:#1f1e18; --ink:#f1eee6; --muted:#a9a49a; --line:#33312a; --flag-bg:#3a1d17; --flag-ink:#f3b6a8; }
  }
  :root[data-theme="dark"] { --bg:#16150f; --card:#1f1e18; --ink:#f1eee6; --muted:#a9a49a; --line:#33312a; --flag-bg:#3a1d17; --flag-ink:#f3b6a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { padding: 20px 24px; max-width: 1280px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 24px; margin: 0; font-weight: 600; }
  .range { color: var(--muted); font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .label { color: var(--muted); font-size: 13px; }
  .stat .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .stat .sub { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  th { color: var(--muted); font-weight: 500; border-top: 0; }
  .type { font-weight: 600; }
  .type.vomit { color: var(--vomit); } .type.appetite { color: var(--appetite); }
  .photos img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; margin-right: 4px; }
  .open { color: var(--muted); font-size: 12px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  /* Small devices (an Echo Show 5-class screen): tighter type and spacing. */
  :root[data-compact] body { font-size: 12px; }
  :root[data-compact] main { padding: 10px 12px; }
  :root[data-compact] h1 { font-size: 16px; }
  :root[data-compact] .range { font-size: 11px; }
  :root[data-compact] .stats { grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
  :root[data-compact] .stat { padding: 6px 8px; }
  :root[data-compact] .stat .value { font-size: 18px; }
  :root[data-compact] .stat .label, :root[data-compact] .stat .sub { font-size: 11px; }
  :root[data-compact] th, :root[data-compact] td { padding: 5px 7px; font-size: 11px; }
  :root[data-compact] .photos img { width: 36px; height: 36px; }
</style>
</head>
<body>
<main id="app"><p class="empty">Waiting for the summary…</p></main>
<script>
(function () {
  "use strict";
  var LABELS = { vomit: "Vomiting", appetite: "Appetite" };
  var FIELD = { content: "Content", has_blood: "Blood", episode_count: "Episodes", low_energy: "Low energy",
                minutes_after_meal: "Min after meal", status: "Status", hours_since_food: "Hours since food" };

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function when(iso) { var d = new Date(iso); return d.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
  function fmtDetails(details) {
    var parts = [];
    Object.keys(details || {}).forEach(function (k) {
      var v = details[k];
      if (v === null || v === undefined) return;
      if (v === true) v = "yes"; else if (v === false) v = "no";
      parts.push((FIELD[k] || k) + ": " + String(v).replace(/_/g, " "));
    });
    return parts.join(" · ") || "No details yet";
  }

  function render(data) {
    var root = document.getElementById("app");
    root.textContent = "";
    if (!data || !data.timeline) { root.appendChild(el("p", "empty", "No summary data.")); return; }

    var header = el("header");
    header.appendChild(el("h1", null, data.cat + " · last " + data.days + " days"));
    header.appendChild(el("span", "range", when(data.start) + " – " + when(data.end)));
    root.appendChild(header);

    var stats = el("div", "stats");
    var prev = {};
    (data.comparisons || []).forEach(function (c) { prev[c.event_type] = c.previous; });
    ["vomit", "appetite"].forEach(function (t) {
      var card = el("div", "stat");
      card.appendChild(el("div", "label", LABELS[t]));
      card.appendChild(el("div", "value", String(data.counts[t] || 0)));
      card.appendChild(el("div", "sub", "vs " + (prev[t] || 0) + " in the " + data.days + " days before"));
      stats.appendChild(card);
    });
    var total = el("div", "stat");
    total.appendChild(el("div", "label", "All observations"));
    total.appendChild(el("div", "value", String(data.counts.total_events || 0)));
    total.appendChild(el("div", "sub", "logged by the family"));
    stats.appendChild(total);
    root.appendChild(stats);

    if (data.timeline.length) {
      var table = el("table");
      var head = el("tr");
      ["When", "Type", "Details", "By", "Photos"].forEach(function (h) { head.appendChild(el("th", null, h)); });
      table.appendChild(head);
      data.timeline.forEach(function (o) {
        var tr = el("tr");
        tr.appendChild(el("td", null, when(o.occurred_at)));
        var type = el("td"); type.appendChild(el("span", "type " + o.event_type, LABELS[o.event_type] || o.event_type));
        if (o.status !== "completed") type.appendChild(el("div", "open", "follow-up open"));
        tr.appendChild(type);
        tr.appendChild(el("td", null, fmtDetails(o.details)));
        tr.appendChild(el("td", null, o.reporter || "—"));
        var photos = el("td", "photos");
        (o.photos || []).forEach(function (p) { var img = el("img"); img.src = p.url; img.alt = "Photo"; photos.appendChild(img); });
        if (!(o.photos || []).length) photos.appendChild(el("span", "open", "—"));
        tr.appendChild(photos);
        table.appendChild(tr);
      });
      root.appendChild(table);
    } else {
      root.appendChild(el("p", "empty", "Nothing logged in this period."));
    }
    root.appendChild(el("p", "note", data.safety_note || "Observations logged by the family. Not a diagnosis."));
    reportSize();
  }

  // ---- minimal MCP Apps bridge (view side) ----
  var nextId = 1;
  function send(msg) { window.parent.postMessage(Object.assign({ jsonrpc: "2.0" }, msg), "*"); }
  function reportSize() {
    send({ method: "ui/notifications/size-changed", params: { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight } });
  }
  function applyContext(ctx) {
    if (!ctx) return;
    if (ctx.theme) document.documentElement.setAttribute("data-theme", ctx.theme);
    if (ctx.deviceClass === "small") document.documentElement.setAttribute("data-compact", "");
  }
  var initId = nextId++;
  window.addEventListener("message", function (event) {
    var m = event.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id === initId && m.result) {
      applyContext(m.result.hostContext);
      send({ method: "ui/notifications/initialized", params: {} });
    } else if (m.method === "ui/notifications/tool-result") {
      render(m.params && m.params.structuredContent);
    } else if (m.method === "ui/notifications/host-context-changed") {
      applyContext(m.params);
    }
  });
  send({ id: initId, method: "ui/initialize", params: { protocolVersion: "2026-01-26", appInfo: { name: "cat-nanny-vet-summary", version: "0.2.0" }, appCapabilities: {} } });
})();
</script>
</body>
</html>
